name: 楽天 急上昇→記事下書き

on:
  schedule:
    # 毎朝 7:43（日本時間）= 22:43 UTC
    - cron: "43 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "OpenAIを呼ばずに動作確認する"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: rakuten-trend
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: ランキング取得→前日比較→下書き生成
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_REFERER: ${{ secrets.RAKUTEN_REFERER }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python scripts/rakuten_trend.py

      - name: 結果をコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data drafts
          git diff --cached --quiet && exit 0
          git commit -m "rakuten-trend: $(TZ=Asia/Tokyo date +%F)"
          git push
